name: Build Dylib
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies and Theos
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang lld make zip unzip git curl perl python3 libtinfo6 fakeroot
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"

      - name: Install iOS SDK and Toolchain
        run: |
          mkdir -p "$HOME/theos/sdks"
          curl -sSL -o sdks.zip https://github.com/theos/sdks/archive/refs/heads/master.zip
          unzip -q sdks.zip
          find sdks-master -name "*.sdk" -type d -exec mv {} "$HOME/theos/sdks/" \;
          ls -la "$HOME/theos/sdks/"

          curl -sSL -o toolchain.tar.xz https://github.com/sbingner/llvm-project/releases/download/v10.0.0-1/iphoneos-arm64.tar.xz || true
          if [ -f toolchain.tar.xz ]; then
            mkdir -p "$HOME/theos/toolchain/linux/iphone"
            tar -xf toolchain.tar.xz -C "$HOME/theos/toolchain/linux/iphone" --strip-components=1 || true
          fi

      - name: Build Tweak
        run: |
          export THEOS="$HOME/theos"
          make clean
          make
          mkdir -p output
          find .theos/obj -name "TuanPopup.dylib" -exec cp {} output/ \;
          ls -la output/

      - name: Upload Dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TuanPopup-dylib
          path: output/TuanPopup.dylib
