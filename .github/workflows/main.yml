name: Build Dylib
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies and Theos
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang lld make zip unzip git curl perl python3 libtinfo6 fakeroot
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"

      - name: Install iOS SDK and Toolchain
        run: |
          mkdir -p "$HOME/theos/sdks" "$HOME/theos/toolchain/linux/iphone"
          curl -sSL -o sdks.zip https://github.com/theos/sdks/archive/refs/heads/master.zip
          unzip -q sdks.zip
          for sdk in $(find sdks-master -name "*.sdk" -type d 2>/dev/null); do
            if [ -e "$sdk" ]; then
              cp -rL "$sdk" "$HOME/theos/sdks/" 2>/dev/null || true
            fi
          done
          ls -la "$HOME/theos/sdks/"

          curl -sSL -o toolchain.tar.xz https://github.com/sbingner/llvm-project/releases/download/v10.0.0-1/iphoneos-arm64.tar.xz
          tar -xf toolchain.tar.xz -C "$HOME/theos/toolchain/linux/iphone" --strip-components=1
          find "$HOME/theos/toolchain" -maxdepth 4 -type f -executable | head -n 30

      - name: Build Tweak
        run: |
          export THEOS="$HOME/theos"
          export PATH="$THEOS/toolchain/linux/iphone/bin:$PATH"
          which clang || which aarch64-apple-darwin-clang || true
          make clean
          make
          mkdir -p output
          find .theos/obj -name "TuanPopup.dylib" -exec cp {} output/ \;
          ls -la output/

      - name: Upload Dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TuanPopup-dylib
          path: output/TuanPopup.dylib
